<style>
/* Layout: slim top bar, then either a centered code-entry panel, a sticky-index form with long sections, or a director roster table. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --soft:#EBEDF4; --ink:#171C28; --muted:#586177; --line:#D8DCE6;
  --accent:#B01E23; --accent-ink:#FFFFFF; --accent-soft:#F8E4E4;
  --ok:#1B7647; --ok-soft:#DDF0E5; --warn:#8F5A00; --warn-soft:#F8EBCF;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1219; --surface:#171B25; --soft:#1F2430; --ink:#E8EBF2; --muted:#9AA3B6; --line:#2B3141;
  --accent:#EF5A5F; --accent-ink:#1A0809; --accent-soft:#3A1A1D;
  --ok:#52C98F; --ok-soft:#173326; --warn:#E5AE3A; --warn-soft:#3A2D10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1219; --surface:#171B25; --soft:#1F2430; --ink:#E8EBF2; --muted:#9AA3B6; --line:#2B3141;
  --accent:#EF5A5F; --accent-ink:#1A0809; --accent-soft:#3A1A1D;
  --ok:#52C98F; --ok-soft:#173326; --warn:#E5AE3A; --warn-soft:#3A2D10; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:1100px;margin-inline:auto}

.topbar{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px}
.brand b{color:var(--accent)}
.cycle{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.topbar .sp{flex:1}

button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 2px;font-weight:600}
.btn[disabled]{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* entry */
.entry{max-width:520px;margin:9vh auto 0}
.entry h1{font-size:clamp(28px,6vw,40px);line-height:1.08;margin-bottom:12px}
.entry p{color:var(--muted);margin:0 0 22px}
.codebox{width:100%;font-family:var(--f-mono);font-size:26px;letter-spacing:.14em;text-transform:uppercase;text-align:center;
  padding:14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.codebox:focus{border-color:var(--accent);outline:none}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.rolepick .btn{padding:14px;font-size:15px}
.err{color:var(--accent);margin-top:12px;font-size:14px;min-height:20px}
.dirlink{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--soft);border-radius:10px}
.segbtn{border:0;background:none;padding:10px;border-radius:7px;font-weight:600;color:var(--muted)}
.segbtn[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.inp.big{font-size:17px;padding:13px}
.advrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 0;border-top:1px solid var(--line)}
.advrow .nm{flex:1;min-width:160px;font-weight:600}
.codebox2{margin-top:26px;color:var(--muted);font-size:14px}
.codebox2 summary{cursor:pointer}

/* record */
.rec-head{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;padding-block:26px 18px}
.rec-head h1{font-size:clamp(26px,5vw,36px);line-height:1.1}
.rec-head .meta{color:var(--muted);font-size:14px}
.rec-head .grow{flex:1;min-width:240px}
.chip{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;background:var(--soft);padding:3px 8px;border-radius:6px}
.save{font-size:13px;color:var(--muted);min-height:20px}
.save.error{color:var(--accent)}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;align-items:start}
.index{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px}
.index button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;padding:7px 10px;border-radius:7px;color:var(--muted);font-size:14px}
.index button:hover{background:var(--soft);color:var(--ink)}
.index .cnt{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12px}
.index .cnt.done{color:var(--ok)}
.sec{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 14px;padding-block:26px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:4px}
.num{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;color:var(--accent)}
.sec h2{font-size:21px;margin-bottom:4px}
.sec .blurb{color:var(--muted);font-size:14px;margin:0 0 16px}
.fields{display:flex;flex-direction:column;gap:18px}
.field label,.field .lbl{display:block;font-weight:600;font-size:14px;margin-bottom:2px}
.field .hint{color:var(--muted);font-size:13px;margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none}
textarea.inp{resize:vertical;min-height:92px;line-height:1.5;max-width:68ch;display:block}
.inp[readonly],.inp:disabled{background:var(--soft)}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;gap:8px;align-items:end}
.row .cell{min-width:0}
.row .cell span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.ro-val{white-space:pre-wrap;max-width:68ch;padding:9px 11px;background:var(--soft);border-radius:8px;min-height:38px}
.ro-val.empty{color:var(--muted);font-style:italic}
.ro-list{display:flex;flex-direction:column;gap:4px}
.ro-list div{padding:7px 11px;background:var(--soft);border-radius:8px}
.ro-list em{font-style:normal;color:var(--muted);font-size:13px;margin-left:6px}
.studentro{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:26px}
.studentro>summary{cursor:pointer;padding:14px 18px;font-family:var(--f-display);font-weight:700;font-size:18px}
.studentro .inner{padding:0 18px 8px}
.studentro .sec{grid-template-columns:34px minmax(0,1fr)}
.studentro .num{font-size:26px}
.studentro .sec h2{font-size:17px}

.rating{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:flex-start}
.rbtns{display:grid;grid-template-columns:repeat(4,56px);gap:6px}
.rate{height:46px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--f-display);font-weight:700;font-size:20px}
.rate:hover{border-color:var(--muted)}
.rate[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rcap{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:12px}
.cat{align-self:center;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.cat[data-c="t"]{background:var(--ok-soft);color:var(--ok)}
.cat[data-c="a"]{background:var(--warn-soft);color:var(--warn)}
.cat[data-c="n"]{background:var(--accent-soft);color:var(--accent)}

.submitbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-top:10px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.submitbar p{margin:0;flex:1;min-width:220px;color:var(--muted);font-size:14px}
.notice{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin-bottom:16px;font-size:14px}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill[data-s="done"]{background:var(--ok-soft);color:var(--ok)}
.pill[data-s="prog"]{background:var(--warn-soft);color:var(--warn)}

/* director */
.dir h1{font-size:clamp(26px,5vw,36px);padding-block:26px 6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:18px}
.panel h2{font-size:19px;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.dates{display:flex;gap:12px;flex-wrap:wrap}
.dates label{font-size:13px;color:var(--muted)}
.dates input{display:block;margin-top:2px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.code{font-family:var(--f-mono);letter-spacing:.06em;white-space:nowrap}
td .inp{width:64px;padding:5px 7px}
.acts{display:flex;gap:4px;white-space:nowrap}
.narr{border-top:1px solid var(--line);padding-block:14px}
.narr:first-of-type{border-top:0}
.narr .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.narr h3{font-size:16px}
.narr p{margin:0;max-width:78ch;white-space:pre-wrap}
.empty-state{padding:26px 8px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;z-index:20}

@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .index{display:none}
  .twocol{grid-template-columns:minmax(0,1fr)}
  .sec{grid-template-columns:minmax(0,1fr)}
  .num{font-size:26px;margin-bottom:4px}
  .row{grid-template-columns:minmax(0,1fr)!important}
  .studentro .sec{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

:root{color-scheme:light}
body{margin:0}
.msg{margin-top:12px;font-size:14px;min-height:20px;max-width:60ch}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--accent)}

    setTimeout(function(){ autosize(ta); }, 0);
  } else if (f.type === "list") {
    var rowsData = (value && value.length) ? value.map(function(r){ return Object.assign({}, r); }) : [];
    var host = h("div", {class:"rows"});
    var tpl = f.cols.map(function(c){ return c.w; }).join(" ") + " 34px";
    function commit(){ onChange(rowsData.map(function(r){ var o = Object.assign({}, r); return o; })); }
    function draw(){
      host.replaceChildren();
      rowsData.forEach(function(r, i){
        var row = h("div", {class:"row", style:"grid-template-columns:" + tpl});
        f.cols.forEach(function(c){
          var ctl;
          if (c.type === "select") {
            ctl = h("select", {class:"inp", disabled:!canWrite, onchange:function(e){ r[c.k] = e.target.value; commit(); }},
              [h("option", {value:"", text:"Choose…"})].concat(c.opts.map(function(o){ return h("option", {value:o, text:o, selected:r[c.k] === o}); })));
          } else {
            ctl = h("input", {class:"inp", type:"text", value:r[c.k] || "", disabled:!canWrite, oninput:function(e){ r[c.k] = e.target.value; commit(); }});
          }
          row.append(h("div", {class:"cell"}, h("span", {text:c.label}), ctl));
        });
        row.append(h("button", {class:"btn sm", type:"button", title:"Remove row", "aria-label":"Remove row", text:"✕", disabled:!canWrite,
          onclick:function(){ rowsData.splice(i,1); commit(); draw(); }}));
        host.append(row);
      });
    }
    draw();
    box.append(host);
    box.append(h("div", {style:"margin-top:8px"}, h("button", {class:"btn sm", type:"button", text:"+ " + f.add, disabled:!canWrite,
      onclick:function(){ rowsData.push({}); commit(); draw(); var first = host.querySelector(".row:last-child input,.row:last-child select"); if (first) first.focus(); }})));
  }
  return box;
}

function sectionEl(sec, data, onChange, ro, onInput){
  var wrap = h("section", {class:"sec", id:"sec_" + (ro ? "ro_" : "") + sec.id});
  wrap.append(h("div", {class:"num", text:sec.n || ""}));
  var body = h("div", null, h("h2", {text:sec.title}));
  if (sec.blurb) body.append(h("p", {class:"blurb", text:sec.blurb}));
  var fields = h("div", {class:"fields"});
  sec.fields.forEach(function(f){
    fields.append(fieldEl(f, data[f.k], function(v){ onChange(f.k, v); if (onInput) onInput(); }, ro));
  });
  body.append(fields);
  wrap.append(body);
  return wrap;
}

function ratingEl(value, onChange, ro){
  var cur = typeof value === "number" ? value : null;
  var wrap = h("div", {class:"rating", role:"group"});
  var cat = h("span", {class:"cat"});
  function paint(){
    btns.forEach(function(b, i){ b.setAttribute("aria-pressed", String(cur === i + 1)); });
    if (cur) { cat.dataset.c = ratingCat(cur); cat.textContent = CAT_NAME[ratingCat(cur)]; }
    else { delete cat.dataset.c; cat.textContent = "Not rated"; }
  }
  var btns = [1,2,3,4].map(function(n){
    return h("button", {type:"button", class:"rate", text:String(n), disabled:ro || !canWrite, "aria-label":"Rating " + n,
      onclick:function(){ cur = (cur === n) ? null : n; paint(); onChange(cur); }});
  });
  var grid = h("div", {class:"rbtns"}, btns,
    h("div", {class:"rcap"}, h("span", {text:"Developing skill"}), h("span", {text:"Independent researcher"})));
  wrap.append(grid, cat);
  paint();
  return wrap;
}

var main = document.getElementById("main");
function show(el){ main.replaceChildren(el); window.scrollTo(0,0); }
function ls(k, v){
  try {
    if (v === undefined) return localStorage.getItem(k);
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
  } catch(_) { return null; }
}
function lastWord(n){ var p = String(n || "").trim().split(/\s+/); return p[p.length - 1] || ""; }
function bySort(a, b){ return a.sortName.localeCompare(b.sortName); }

function goEntry(){
  var mode = ls("bbc26:mode") === "advisor" ? "advisor" : "student";
  var selStudent = ls("bbc26:student") || "", selAdvisor = ls("bbc26:advisor") || "";
  var panel = h("div", {style:"margin-top:16px"});
  var segBtns = {};
  var seg = h("div", {class:"seg", role:"tablist"});
  [["student","I'm a student"],["advisor","I'm an advisor"]].forEach(function(p){
    segBtns[p[0]] = h("button", {type:"button", class:"segbtn", role:"tab", text:p[1], onclick:function(){ mode = p[0]; ls("bbc26:mode", mode); paint(); }});
    seg.append(segBtns[p[0]]);
  });
  function submittedMark(role, id){ return ls("bbc26:" + role + ":" + id + ":submitted") ? "done" : (ls("bbc26:" + role + ":" + id) ? "prog" : "none"); }
  var LBL = {done:"Submitted from this device", prog:"Draft saved", none:"Not started"};
  function paint(){
    Object.keys(segBtns).forEach(function(k){ segBtns[k].setAttribute("aria-selected", String(k === mode)); });
    panel.replaceChildren();
    if (mode === "student") {
      var sorted = ROSTER.slice().sort(bySort);
      var btn = h("button", {class:"btn primary", type:"button", text:"Open my report", disabled:!selStudent, onclick:function(){ openForm("student", ROSTER.filter(function(r){ return r.id === selStudent; })[0]); }});
      var sel = h("select", {class:"inp big", id:"studentSel", "aria-label":"Your name", onchange:function(e){ selStudent = e.target.value; ls("bbc26:student", selStudent); btn.disabled = !selStudent; }},
        [h("option", {value:"", text:"Choose your name…"})].concat(sorted.map(function(d){ return h("option", {value:d.id, text:d.sortName, selected:d.id === selStudent}); })));
      panel.append(sel, h("div", {style:"margin-top:12px"}, btn));
    } else {
      var names = Array.from(new Set(ROSTER.map(function(d){ return d.advisor; }))).sort(function(a, b){ return lastWord(a).localeCompare(lastWord(b)); });
      var list = h("div", {style:"margin-top:14px"});
      function paintList(){
        list.replaceChildren();
        if (!selAdvisor) return;
        var mine = ROSTER.filter(function(d){ return d.advisor === selAdvisor; }).sort(bySort);
        list.append(h("div", {style:"color:var(--muted);font-size:13px;margin-bottom:2px", text:"Your students (" + mine.length + ")"}));
        mine.forEach(function(d){
          var s = submittedMark("advisor", d.id);
          list.append(h("div", {class:"advrow"}, h("span", {class:"nm", text:d.name}),
            h("span", {class:"pill", "data-s":s, text:LBL[s]}),
            h("button", {class:"btn sm primary", type:"button", text:"Review", onclick:function(){ openForm("advisor", d); }})));
        });
      }
      var asel = h("select", {class:"inp big", id:"advisorSel", "aria-label":"Your name", onchange:function(e){ selAdvisor = e.target.value; ls("bbc26:advisor", selAdvisor); paintList(); }},
        [h("option", {value:"", text:"Choose your name…"})].concat(names.map(function(n){ return h("option", {value:n, text:n, selected:n === selAdvisor}); })));
      panel.append(asel, list);
      paintList();
    }
  }
  show(h("div", {class:"entry"},
    h("h1", {text:"Annual report for BBC doctoral students"}),
    h("p", {text:"Choose your name to begin. Students fill in their section. Advisors choose their own name, then review each of their students. Your answers are saved on this device as you type and are sent only when you submit."}),
    seg, panel));
  paint();
}

function openForm(role, rec){
  var key = "bbc26:" + role + ":" + rec.id;
  var data = {};
  try { data = JSON.parse(ls(key) || "{}") || {}; } catch(_) { data = {}; }
  var saveEl = h("div", {class:"save"}), timer = null;
  function set(k, v){
    data[k] = v;
    clearTimeout(timer);
    timer = setTimeout(function(){ ls(key, JSON.stringify(data)); saveEl.textContent = "Draft saved on this device " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); }, 400);
  }
  var body = h("div");
  if (role === "student") {
    STUDENT.forEach(function(s){ body.append(sectionEl(s, data, set, false)); });
  } else {
    RATED.forEach(function(g){
      body.append(h("section", {class:"sec"}, h("div", {class:"num", text:g.n}),
        h("div", null, h("h2", {text:g.title}),
          h("p", {class:"blurb", text:"Rate from 1 (developing skill) to 4 (independent researcher). A mean of 3–4 is Target, 2 is Acceptable and 1 is Needs improvement."}),
          h("div", {class:"fields"},
            h("div", {class:"field"}, h("span", {class:"lbl", text:"Your rating"}), ratingEl(data["r" + g.n], function(v){ set("r" + g.n, v); }, false)),
            fieldEl({k:"c" + g.n, type:"long", label:"Comments", hint:"Briefly note the evidence behind the rating."}, data["c" + g.n], function(v){ set("c" + g.n, v); }, false)))));
    });
    body.append(h("section", {class:"sec"}, h("div", {class:"num", text:4}),
      h("div", null, h("h2", {text:"Teaching"}),
        h("p", {class:"blurb", text:"Optional. The program director scores teaching from course evaluations, so no rating is needed here."}),
        h("div", {class:"fields"}, fieldEl({k:"c4", type:"long", label:"Comments on teaching"}, data.c4, function(v){ set("c4", v); }, false)))));
    var met = h("select", {class:"inp", id:"f_met", style:"max-width:240px", onchange:function(e){ set("met", e.target.value); }},
      ["", "Yes", "Not yet"].map(function(o){ return h("option", {value:o, text:o || "Choose…", selected:(data.met || "") === o}); }));
    body.append(h("section", {class:"sec"}, h("div", {class:"num", text:""}),
      h("div", null, h("h2", {text:"Overall"}), h("div", {class:"fields", style:"margin-top:14px"},
        fieldEl({k:"c_overall", type:"long", label:"Overall assessment and recommended next steps"}, data.c_overall, function(v){ set("c_overall", v); }, false),
        h("div", {class:"field"}, h("label", {for:"f_met", text:"Have you discussed this review with the student?"}), met)))));
  }

  /* submit */
  var emailIn = h("input", {class:"inp", id:"email", type:"email", autocomplete:"email", placeholder:"you@bu.edu", value:ls("bbc26:email:" + role) || "", style:"max-width:360px"});
  var msg = h("div", {class:"msg", role:"status"});
  var btn = h("button", {class:"btn primary", type:"button", onclick:submit});
  var label = role === "student" ? "Submit my report" : "Submit review";
  btn.textContent = label;
  function note(text, cls){ msg.className = "msg " + (cls || ""); msg.textContent = text; }
  var prev = ls(key + ":submitted");
  if (prev) note("Last submitted " + new Date(prev).toLocaleString() + ". You can edit and submit again; the latest submission is used.", "ok");

  async function submit(){
    var email = emailIn.value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { note("Enter your email address to submit.", "bad"); emailIn.focus(); return; }
    if (role === "advisor" && !RATED.some(function(g){ return typeof data["r" + g.n] === "number"; })) { note("Add at least one rating before submitting.", "bad"); return; }
    if (role === "student" && !Object.keys(data).some(function(k){ return isFilled(data[k]); })) { note("Answer at least one question before submitting.", "bad"); return; }
    if (!ENDPOINT) { note("This form is not connected to its response sheet yet. Your draft is saved on this device.", "bad"); return; }
    clearTimeout(timer); ls(key, JSON.stringify(data)); ls("bbc26:email:" + role, email);
    btn.disabled = true; btn.textContent = "Submitting…"; note("");
    try {
      var res = await fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({role:role, studentId:rec.id, email:email, cycle:CYCLE, answers:data})});
      var j = await res.json();
      if (j && j.ok) { ls(key + ":submitted", new Date().toISOString()); note("Submitted " + new Date().toLocaleString() + ". Thank you. You can edit and submit again; the latest submission is used.", "ok"); }
      else note((j && j.error) || "The submission was not accepted.", "bad");
    } catch(e) { note("Could not reach the server. Your draft is saved on this device. Try again in a minute.", "bad"); }
    btn.disabled = false; btn.textContent = label;
  }

  var back = h("button", {class:"btn link", type:"button", text:"← Back", onclick:goEntry});
  show(h("div", {style:"max-width:760px"},
    h("div", {class:"rec-head"}, h("div", {class:"grow"}, h("div", null, back),
      h("h1", {text:role === "student" ? rec.name : "Review: " + rec.name}),
      h("div", {class:"meta", text:"Advisor: " + rec.advisor + " · Cycle " + CYCLE}), saveEl)),
    body,
    h("section", {class:"sec", style:"grid-template-columns:minmax(0,1fr)"},
      h("div", null, h("h2", {text:"Submit"}),
        h("p", {class:"blurb", text:"Enter the BU email address the program has on file for you. Submissions from other addresses are rejected."}),
        h("div", {class:"field"}, h("label", {for:"email", text:"Your email address"}), emailIn),
        h("div", {style:"margin-top:14px"}, btn), msg))));
}

goEntry();
})();

</script></body></html>
