<title>BBC Annual Report Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: slim top bar, then either a centered code-entry panel, a sticky-index form with long sections, or a director roster table. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --soft:#EBEDF4; --ink:#171C28; --muted:#586177; --line:#D8DCE6;
  --accent:#B01E23; --accent-ink:#FFFFFF; --accent-soft:#F8E4E4;
  --ok:#1B7647; --ok-soft:#DDF0E5; --warn:#8F5A00; --warn-soft:#F8EBCF;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1219; --surface:#171B25; --soft:#1F2430; --ink:#E8EBF2; --muted:#9AA3B6; --line:#2B3141;
  --accent:#EF5A5F; --accent-ink:#1A0809; --accent-soft:#3A1A1D;
  --ok:#52C98F; --ok-soft:#173326; --warn:#E5AE3A; --warn-soft:#3A2D10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1219; --surface:#171B25; --soft:#1F2430; --ink:#E8EBF2; --muted:#9AA3B6; --line:#2B3141;
  --accent:#EF5A5F; --accent-ink:#1A0809; --accent-soft:#3A1A1D;
  --ok:#52C98F; --ok-soft:#173326; --warn:#E5AE3A; --warn-soft:#3A2D10; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:1100px;margin-inline:auto}

.topbar{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px}
.brand b{color:var(--accent)}
.cycle{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.topbar .sp{flex:1}

button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 2px;font-weight:600}
.btn[disabled]{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* entry */
.entry{max-width:520px;margin:9vh auto 0}
.entry h1{font-size:clamp(28px,6vw,40px);line-height:1.08;margin-bottom:12px}
.entry p{color:var(--muted);margin:0 0 22px}
.codebox{width:100%;font-family:var(--f-mono);font-size:26px;letter-spacing:.14em;text-transform:uppercase;text-align:center;
  padding:14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.codebox:focus{border-color:var(--accent);outline:none}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.rolepick .btn{padding:14px;font-size:15px}
.err{color:var(--accent);margin-top:12px;font-size:14px;min-height:20px}
.dirlink{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px}

/* record */
.rec-head{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;padding-block:26px 18px}
.rec-head h1{font-size:clamp(26px,5vw,36px);line-height:1.1}
.rec-head .meta{color:var(--muted);font-size:14px}
.rec-head .grow{flex:1;min-width:240px}
.chip{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;background:var(--soft);padding:3px 8px;border-radius:6px}
.save{font-size:13px;color:var(--muted);min-height:20px}
.save.error{color:var(--accent)}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;align-items:start}
.index{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px}
.index button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;padding:7px 10px;border-radius:7px;color:var(--muted);font-size:14px}
.index button:hover{background:var(--soft);color:var(--ink)}
.index .cnt{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12px}
.index .cnt.done{color:var(--ok)}
.sec{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 14px;padding-block:26px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:4px}
.num{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;color:var(--accent)}
.sec h2{font-size:21px;margin-bottom:4px}
.sec .blurb{color:var(--muted);font-size:14px;margin:0 0 16px}
.fields{display:flex;flex-direction:column;gap:18px}
.field label,.field .lbl{display:block;font-weight:600;font-size:14px;margin-bottom:2px}
.field .hint{color:var(--muted);font-size:13px;margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none}
textarea.inp{resize:vertical;min-height:92px;line-height:1.5;max-width:68ch;display:block}
.inp[readonly],.inp:disabled{background:var(--soft)}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;gap:8px;align-items:end}
.row .cell{min-width:0}
.row .cell span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.ro-val{white-space:pre-wrap;max-width:68ch;padding:9px 11px;background:var(--soft);border-radius:8px;min-height:38px}
.ro-val.empty{color:var(--muted);font-style:italic}
.ro-list{display:flex;flex-direction:column;gap:4px}
.ro-list div{padding:7px 11px;background:var(--soft);border-radius:8px}
.ro-list em{font-style:normal;color:var(--muted);font-size:13px;margin-left:6px}
.studentro{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:26px}
.studentro>summary{cursor:pointer;padding:14px 18px;font-family:var(--f-display);font-weight:700;font-size:18px}
.studentro .inner{padding:0 18px 8px}
.studentro .sec{grid-template-columns:34px minmax(0,1fr)}
.studentro .num{font-size:26px}
.studentro .sec h2{font-size:17px}

.rating{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:flex-start}
.rbtns{display:grid;grid-template-columns:repeat(4,56px);gap:6px}
.rate{height:46px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--f-display);font-weight:700;font-size:20px}
.rate:hover{border-color:var(--muted)}
.rate[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rcap{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:12px}
.cat{align-self:center;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.cat[data-c="t"]{background:var(--ok-soft);color:var(--ok)}
.cat[data-c="a"]{background:var(--warn-soft);color:var(--warn)}
.cat[data-c="n"]{background:var(--accent-soft);color:var(--accent)}

.submitbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-top:10px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.submitbar p{margin:0;flex:1;min-width:220px;color:var(--muted);font-size:14px}
.notice{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin-bottom:16px;font-size:14px}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill[data-s="done"]{background:var(--ok-soft);color:var(--ok)}
.pill[data-s="prog"]{background:var(--warn-soft);color:var(--warn)}

/* director */
.dir h1{font-size:clamp(26px,5vw,36px);padding-block:26px 6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:18px}
.panel h2{font-size:19px;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.dates{display:flex;gap:12px;flex-wrap:wrap}
.dates label{font-size:13px;color:var(--muted)}
.dates input{display:block;margin-top:2px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.code{font-family:var(--f-mono);letter-spacing:.06em;white-space:nowrap}
td .inp{width:64px;padding:5px 7px}
.acts{display:flex;gap:4px;white-space:nowrap}
.narr{border-top:1px solid var(--line);padding-block:14px}
.narr:first-of-type{border-top:0}
.narr .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.narr h3{font-size:16px}
.narr p{margin:0;max-width:78ch;white-space:pre-wrap}
.empty-state{padding:26px 8px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;z-index:20}

@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .index{display:none}
  .twocol{grid-template-columns:minmax(0,1fr)}
  .sec{grid-template-columns:minmax(0,1fr)}
  .num{font-size:26px;margin-bottom:4px}
  .row{grid-template-columns:minmax(0,1fr)!important}
  .studentro .sec{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <div class="topbar">
    <span class="brand">BBC <b>Annual Report</b></span>
    <span class="cycle" id="cycleLabel">PhD Program in Psychology · Brain, Behavior &amp; Cognition</span>
    <span class="sp"></span>
    <span class="cycle" id="whoLabel"></span>
  </div>
  <main id="main"></main>
</div>
<div id="toastHost"></div>

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
function h(tag, attrs){
  var e = document.createElement(tag);
  var a = attrs || {};
  Object.keys(a).forEach(function(k){
    var v = a[k];
    if (v == null || v === false) return;
    if (k === "class") e.className = v;
    else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), v);
    else if (k === "text") e.textContent = v;
    else if (k === "style") e.setAttribute("style", v);
    else if (k in e) { try { e[k] = v; } catch(_) { e.setAttribute(k, v); } }
    else e.setAttribute(k, v);
  });
  for (var i = 2; i < arguments.length; i++) add(e, arguments[i]);
  return e;
}
function add(e, c){
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function(x){ add(e, x); }); return; }
  e.append(c.nodeType ? c : document.createTextNode(String(c)));
}
function toast(msg){
  var t = h("div", {class:"toast", text:msg});
  document.getElementById("toastHost").append(t);
  setTimeout(function(){ t.remove(); }, 1800);
}
function copy(text, label){
  function fallback(){
    var ta = h("textarea", {value:text, style:"position:fixed;opacity:0"});
    document.body.append(ta); ta.select();
    try { document.execCommand("copy"); toast(label || "Copied"); } catch(_) { toast("Select and copy manually"); }
    ta.remove();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ toast(label || "Copied"); }, fallback);
  } else fallback();
}
function isFilled(v){
  if (Array.isArray(v)) return v.some(function(r){ return Object.keys(r).some(function(k){ return String(r[k] || "").trim() && k !== "_"; }); });
  return v != null && String(v).trim() !== "";
}
function hasContent(o){ return !!o && Object.keys(o).some(function(k){ return isFilled(o[k]); }); }
function fmtDate(iso){ if(!iso) return "—"; var p = iso.split("-"); return p.length === 3 ? p[1]+"/"+p[2]+"/"+p[0] : iso; }
var ALPHA = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function newCode(){
  var b = new Uint8Array(8); crypto.getRandomValues(b);
  var s = ""; for (var i = 0; i < 8; i++) s += ALPHA[b[i] % ALPHA.length];
  return s.slice(0,4) + "-" + s.slice(4);
}
function normCode(s){
  var c = String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  return c.length === 8 ? c.slice(0,4) + "-" + c.slice(4) : c;
}

/* ---------- form definitions ---------- */
var STUDENT = [
  {id:"g1", n:1, title:"Mastery of existing theory and research", blurb:"What you learned and which milestones you reached this cycle.", fields:[
    {k:"g1_stage", type:"line", label:"Current stage and milestones completed", hint:"For example coursework, qualifying project, proposal, candidacy or defense."},
    {k:"g1_summary", type:"long", label:"How did you build your command of the literature?", hint:"Courses, readings, reading groups, exams and committee meetings."}]},
  {id:"g2", n:2, title:"Independent, ethical research", blurb:"Your research output and your own contributions to it.", fields:[
    {k:"g2_pubs", type:"list", label:"Publications and manuscripts", add:"Add publication", cols:[
      {k:"cite", label:"Citation or working title", w:"3fr"},
      {k:"status", label:"Status", type:"select", opts:["In preparation","Submitted","In revision","Accepted","Published"], w:"1fr"}]},
    {k:"g2_talks", type:"list", label:"Talks and posters", add:"Add presentation", cols:[
      {k:"cite", label:"Title, venue and date", w:"3fr"},
      {k:"status", label:"Type", type:"select", opts:["Poster","Talk","Invited talk"], w:"1fr"}]},
    {k:"g2_funding", type:"long", label:"Fellowships, grants and awards", hint:"Applied for or received this cycle."},
    {k:"g2_summary", type:"long", label:"Research progress and your independent contributions"}]},
  {id:"g3", n:3, title:"Professional and ethical scholarly activity", blurb:"How you conducted yourself as a scholar.", fields:[
    {k:"g3_ethics", type:"long", label:"Ethics and responsible conduct of research training"},
    {k:"g3_service", type:"long", label:"Service, mentoring and community contributions", hint:"Lab, program, department, university and field."}]},
  {id:"g4", n:4, title:"Teaching", blurb:"Leave this blank if you did not teach this cycle.", fields:[
    {k:"g4_courses", type:"list", label:"Courses taught", add:"Add course", cols:[
      {k:"term", label:"Term", type:"select", opts:["Fall","Spring","Summer"], w:"1fr"},
      {k:"cite", label:"Course", w:"2fr"},
      {k:"status", label:"Role", type:"select", opts:["Teaching fellow","Teaching assistant","Grader","Guest lecturer","Instructor of record"], w:"1.4fr"}]},
    {k:"g4_reflection", type:"long", label:"Teaching experience and how you developed as a teacher"}]},
  {id:"plan", title:"Looking ahead", blurb:"Shared with your advisor and the program director.", fields:[
    {k:"plan_goals", type:"long", label:"Goals for the next cycle"},
    {k:"plan_support", type:"long", label:"Support you need from your advisor or the program"}]}
];
var RATED = [
  {n:1, id:"g1", title:"Mastery of existing theory and research"},
  {n:2, id:"g2", title:"Independent, ethical research"},
  {n:3, id:"g3", title:"Professional and ethical scholarly activity"}
];
function ratingCat(r){ return r >= 3 ? "t" : r >= 2 ? "a" : "n"; }
var CAT_NAME = {t:"Target", a:"Acceptable", n:"Needs improvement"};

/* ---------- state ---------- */
var db = null, userCap = null, dl = null;
var isDirector = false, canWrite = true;
var cycle = {start:"2025-11-16", end:"2026-11-15"};
var cleanups = [];
function clearViews(){ cleanups.forEach(function(f){ try { f(); } catch(_){} }); cleanups = []; }
var main = document.getElementById("main");
function show(el){ main.replaceChildren(el); window.scrollTo(0,0); }

/* ---------- autosave ---------- */
function makeSaver(ref, onState){
  var pend = {}, timer = null, busy = false;
  function queue(part, key, val){
    if (!pend[part]) pend[part] = {};
    pend[part][key] = val;
    onState("dirty");
    clearTimeout(timer); timer = setTimeout(flush, 700);
  }
  async function flush(){
    clearTimeout(timer);
    if (busy) return;
    busy = true;
    try {
      while (Object.keys(pend).length) {
        var p = pend; pend = {};
        try {
          var body = Object.assign({}, p, {updatedAt:new Date().toISOString()});
          await ref.update(body);
          onState("saved");
        } catch(e) {
          Object.keys(p).forEach(function(part){ pend[part] = Object.assign({}, p[part], pend[part] || {}); });
          onState("error");
          break;
        }
      }
    } finally { busy = false; }
  }
  return {queue:queue, flush:flush};
}

/* ---------- field editors ---------- */
function autosize(t){ t.style.height = "auto"; t.style.height = Math.max(92, t.scrollHeight + 2) + "px"; }

function fieldEl(f, value, onChange, ro){
  var box = h("div", {class:"field"});
  var id = "f_" + f.k;
  if (f.type === "list") box.append(h("span", {class:"lbl", text:f.label}));
  else box.append(h("label", {for:id, text:f.label}));
  if (f.hint) box.append(h("div", {class:"hint", text:f.hint}));

  if (ro) {
    if (f.type === "list") {
      var rows = (value || []).filter(function(r){ return isFilled([r]); });
      box.append(rows.length
        ? h("div", {class:"ro-list"}, rows.map(function(r){
            var parts = f.cols.map(function(c){ return r[c.k]; }).filter(Boolean);
            var lead = (f.cols[0].k === "term" ? parts.slice(0,2).join(" · ") : parts[0] || "");
            var rest = (f.cols[0].k === "term" ? parts.slice(2) : parts.slice(1)).join(" · ");
            return h("div", null, lead, rest ? h("em", {text:rest}) : null);
          }))
        : h("div", {class:"ro-val empty", text:"Nothing entered"}));
    } else {
      var has = isFilled(value);
      box.append(h("div", {class:"ro-val" + (has ? "" : " empty"), text:has ? value : "Nothing entered"}));
    }
    return box;
  }

  if (f.type === "line") {
    box.append(h("input", {class:"inp", id:id, type:"text", value:value || "", disabled:!canWrite,
      oninput:function(e){ onChange(e.target.value); }}));
  } else if (f.type === "long") {
    var ta = h("textarea", {class:"inp", id:id, value:value || "", disabled:!canWrite,
      oninput:function(e){ autosize(e.target); onChange(e.target.value); }});
    box.append(ta);
    setTimeout(function(){ autosize(ta); }, 0);
  } else if (f.type === "list") {
    var rowsData = (value && value.length) ? value.map(function(r){ return Object.assign({}, r); }) : [];
    var host = h("div", {class:"rows"});
    var tpl = f.cols.map(function(c){ return c.w; }).join(" ") + " 34px";
    function commit(){ onChange(rowsData.map(function(r){ var o = Object.assign({}, r); return o; })); }
    function draw(){
      host.replaceChildren();
      rowsData.forEach(function(r, i){
        var row = h("div", {class:"row", style:"grid-template-columns:" + tpl});
        f.cols.forEach(function(c){
          var ctl;
          if (c.type === "select") {
            ctl = h("select", {class:"inp", disabled:!canWrite, onchange:function(e){ r[c.k] = e.target.value; commit(); }},
              [h("option", {value:"", text:"Choose…"})].concat(c.opts.map(function(o){ return h("option", {value:o, text:o, selected:r[c.k] === o}); })));
          } else {
            ctl = h("input", {class:"inp", type:"text", value:r[c.k] || "", disabled:!canWrite, oninput:function(e){ r[c.k] = e.target.value; commit(); }});
          }
          row.append(h("div", {class:"cell"}, h("span", {text:c.label}), ctl));
        });
        row.append(h("button", {class:"btn sm", type:"button", title:"Remove row", "aria-label":"Remove row", text:"✕", disabled:!canWrite,
          onclick:function(){ rowsData.splice(i,1); commit(); draw(); }}));
        host.append(row);
      });
    }
    draw();
    box.append(host);
    box.append(h("div", {style:"margin-top:8px"}, h("button", {class:"btn sm", type:"button", text:"+ " + f.add, disabled:!canWrite,
      onclick:function(){ rowsData.push({}); commit(); draw(); var first = host.querySelector(".row:last-child input,.row:last-child select"); if (first) first.focus(); }})));
  }
  return box;
}

function sectionEl(sec, data, onChange, ro, onInput){
  var wrap = h("section", {class:"sec", id:"sec_" + (ro ? "ro_" : "") + sec.id});
  wrap.append(h("div", {class:"num", text:sec.n || ""}));
  var body = h("div", null, h("h2", {text:sec.title}));
  if (sec.blurb) body.append(h("p", {class:"blurb", text:sec.blurb}));
  var fields = h("div", {class:"fields"});
  sec.fields.forEach(function(f){
    fields.append(fieldEl(f, data[f.k], function(v){ onChange(f.k, v); if (onInput) onInput(); }, ro));

/* ---------- director ---------- */
function mean(a){ return a.length ? a.reduce(function(x,y){ return x + y; }, 0) / a.length : null; }
function nums(a){ return a.filter(function(x){ return typeof x === "number" && !isNaN(x); }); }
function pct(n, d){ return d ? Math.round(100 * n / d) : 0; }
function studentStatus(d, part, key){
  if ((d.status || {})[key]) return "done";
  return hasContent(d[part]) ? "prog" : "none";
}
var PILL = {done:"Submitted", prog:"In progress", none:"Not started"};
function studentMean(d){ var a = nums([1,2,3].map(function(i){ return (d.advisorPart || {})["r" + i]; })); return mean(a); }
function f1(x){ return x == null ? "—" : (Math.round(x * 10) / 10).toFixed(1); }

function goalNarrative(docs, g){
  var rs = nums(docs.map(function(d){ return (d.advisorPart || {})["r" + g.n]; }));
  var lead = "Goal #" + g.n + ". " + g.title + ": ";
  if (!rs.length) return lead + "No faculty ratings have been entered yet.";
  var t = rs.filter(function(r){ return r >= 3; }).length;
  var a = rs.filter(function(r){ return r >= 2 && r < 3; }).length;
  var n = rs.filter(function(r){ return r < 2; }).length;
  var noun = g.n === 1 ? "Scholarship was" : "This goal was quantitatively";
  return lead + noun + " assessed by faculty mentors on a scale from 1 (developing skill) – 4 (independent researcher). Scores were then used by the program director to place them into one of the following categories based on scores: Target (overall mean rating 3-4), Acceptable (overall mean rating 2), and Needs improvement (overall mean rating 1). BBC trainees scored, on average, a " +
    f1(mean(rs)) + " on this measure (n = " + rs.length + " of " + docs.length + " students). " +
    pct(t, rs.length) + "% of BBC students were on Target, " + pct(a, rs.length) + "% were Acceptable, and " + pct(n, rs.length) + "% Needed Improvement.";
}
function tfNarrative(docs){
  var y = parseInt((cycle.start || "").slice(0,4), 10) || new Date().getFullYear();
  var yy = function(v){ return String(v).slice(-2); };
  function band(vals){
    return {n:vals.length,
      t:vals.filter(function(v){ return v >= 4; }).length,
      a:vals.filter(function(v){ return v >= 3 && v < 4; }).length,
      i:vals.filter(function(v){ return v >= 2 && v < 3; }).length,
      u:vals.filter(function(v){ return v < 2; }).length};
  }
  var fall = band(nums(docs.map(function(d){ var v = parseFloat((d.director || {}).tfFall); return isNaN(v) ? null : v; })));
  var spr = band(nums(docs.map(function(d){ var v = parseFloat((d.director || {}).tfSpring); return isNaN(v) ? null : v; })));
  var lead = "Goal #4. Demonstrate Teaching Abilities: ";
  if (!fall.n && !spr.n) return lead + "No teaching evaluation scores have been entered yet. Enter each teaching fellow's mean course-evaluation rating in the roster above.";
  function sentence(label, b){
    return "In the " + label + ", " + b.t + " TF" + (b.t === 1 ? "" : "s") + "' ratings were in the Target range (overall mean rating 4-5), " +
      b.a + " in the Acceptable range (3-4), " + b.i + " in the Needs improvement range (2-3) and " + b.u + " in the Unacceptable range (below 2).";
  }
  return lead + "The performance of BBC students who were teaching fellows during AY " + yy(y) + "/" + yy(y + 1) +
    " was assessed using criteria obtained from course evaluations on the question \"How much did you learn from this course?\" The rubric designed to evaluate their performance was then used by the program director to place them into one of the following categories based on the overall mean rating of their discussion sections: Target (overall mean rating 4-5), Acceptable (overall mean rating 3-4), Needs improvement (overall mean rating 2-3) and Unacceptable (overall mean rating below 2). " +
    "There were " + fall.n + " students who were TFs evaluated in the Fall of " + yy(y) + " and " + spr.n + " students who were TFs evaluated in the Spring of " + yy(y + 1) + ". " +
    sentence("fall", fall) + " " + sentence("spring", spr);
}

function csvEsc(v){ var s = v == null ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function listText(arr){ return (arr || []).filter(function(r){ return isFilled([r]); }).map(function(r){ return [r.term, r.cite, r.status].filter(Boolean).join(" / "); }).join("; "); }
function buildCsv(docs){
  var cols = ["Code","Student","Advisor","Year","Student submitted","Advisor submitted",
    "Rating G1","Rating G2","Rating G3","Mean rating","Comment G1","Comment G2","Comment G3","Comment teaching","Overall comment","Discussed with student",
    "TF eval Fall","TF eval Spring",
    "G1 stage","G1 summary","Publications","Talks and posters","Funding and awards","G2 summary","Ethics training","Service and mentoring","Courses taught","Teaching reflection","Goals next cycle","Support needed"];
  var rows = [cols];
  docs.forEach(function(d){
    var s = d.student || {}, a = d.advisorPart || {}, st = d.status || {}, dr = d.director || {};
    rows.push([d.id, d.name, d.advisor, d.year, st.studentAt, st.advisorAt,
      a.r1, a.r2, a.r3, studentMean(d) == null ? "" : f1(studentMean(d)), a.c1, a.c2, a.c3, a.c4, a.c_overall, a.met,
      dr.tfFall, dr.tfSpring,
      s.g1_stage, s.g1_summary, listText(s.g2_pubs), listText(s.g2_talks), s.g2_funding, s.g2_summary, s.g3_ethics, s.g3_service, listText(s.g4_courses), s.g4_reflection, s.plan_goals, s.plan_support]);
  });
  return rows.map(function(r){ return r.map(csvEsc).join(","); }).join("\n");
}

    h("div", {class:"panel"}, h("h2", {text:"Compiled results"}), h("p", {class:"sub", text:"Draft text for “What were the results and key findings of evidence assessed?” Numbers update as advisors enter ratings and as you enter teaching scores above."}), narrHost));
  show(view);
  paintRoster(); paintNarr();

  var unsub = db.collection("students").onSnapshot(function(snap){
    docs = snap.docs.map(function(s){ return Object.assign({id:s.id}, s.data()); });
    paintRoster(); paintNarr();
  }, function(){});
  cleanups.push(unsub);
}

function paintCycle(){
  document.getElementById("cycleLabel").textContent = "PhD Program in Psychology · Brain, Behavior & Cognition · Cycle " + fmtDate(cycle.start) + " – " + fmtDate(cycle.end);
}
paintCycle();
show(h("div", {class:"entry"}, h("h1", {text:"Annual report for BBC doctoral students"}), h("p", {text:"Loading…"})));

(async function(){
  try { db = await claude.use("db"); userCap = await claude.use("user"); dl = await claude.use("downloads"); } catch(_) { db = null; }
  if (!db) {
    show(h("div", {class:"entry"}, h("h1", {text:"Sign in to continue"}),
      h("p", {text:"This form stores answers for each student, so you need to be signed in to Claude to open it. Sign in, then reload this page."})));
    return;
  }
  try { isDirector = userCap ? await userCap.canEdit() : false; } catch(_) { isDirector = false; }
  try { var cw = userCap ? await userCap.can("data.write") : null; canWrite = cw !== false; } catch(_) {}
  try {
    var c = await db.doc("config/cycle").get();
    if (c.exists) { cycle = Object.assign(cycle, c.data()); paintCycle(); }
    var u = db.doc("config/cycle").onSnapshot(function(s){ if (s.exists) { cycle = Object.assign(cycle, s.data()); paintCycle(); } }, function(){});
  } catch(_) {}
  goEntry();
})();
})();
